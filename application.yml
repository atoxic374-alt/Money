server:
  port: ${SERVER_PORT:2333}
  address: "${SERVER_ADDRESS:0.0.0.0}"
  http2:
    enabled: false

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:${YOUTUBE_PLUGIN_VERSION:1.18.1}"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:${LAVASRC_PLUGIN_VERSION:4.8.1}"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  pluginsDir: "./plugins"
  defaultPluginRepository: "https://maven.lavalink.dev/releases"
  defaultPluginSnapshotRepository: "https://maven.lavalink.dev/snapshots"
  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: false
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    nonAllocatingFrameBuffer: true
    bufferDurationMs: ${LAVALINK_BUFFER_DURATION_MS:1000}
    frameBufferDurationMs: ${LAVALINK_FRAME_BUFFER_DURATION_MS:5000}
    opusEncodingQuality: ${LAVALINK_OPUS_QUALITY:10}
    resamplingQuality: ${LAVALINK_RESAMPLING_QUALITY:MEDIUM}
    trackStuckThresholdMs: ${LAVALINK_TRACK_STUCK_THRESHOLD_MS:10000}
    useSeekGhosting: true
    youtubePlaylistLoadLimit: ${YOUTUBE_PLAYLIST_LOAD_LIMIT:6}
    playerUpdateInterval: ${LAVALINK_PLAYER_UPDATE_INTERVAL:10}
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: true
    gc-warnings: true
    timeouts:
      connectTimeoutMs: ${LAVALINK_CONNECT_TIMEOUT_MS:5000}
      connectionRequestTimeoutMs: ${LAVALINK_CONNECTION_REQUEST_TIMEOUT_MS:5000}
      socketTimeoutMs: ${LAVALINK_SOCKET_TIMEOUT_MS:10000}

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - WEB
      - WEBEMBEDDED
      - MWEB
      - TVHTML5_SIMPLY
    oauth:
      enabled: ${YOUTUBE_OAUTH_ENABLED:false}
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: ${YOUTUBE_OAUTH_SKIP_INITIALIZATION:true}
    pot:
      token: "${YOUTUBE_POT_TOKEN:}"
      visitorData: "${YOUTUBE_VISITOR_DATA:}"
    clientOptions:
      WEB:
        playlistLoading: true
        searching: true
        videoLoading: true
        playback: true
      WEBEMBEDDED:
        playlistLoading: false
        searching: false
        videoLoading: true
        playback: true
      MWEB:
        playlistLoading: true
        searching: true
        videoLoading: true
        playback: true
      TVHTML5_SIMPLY:
        playlistLoading: false
        searching: false
        videoLoading: true
        playback: true
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
      - "ytmsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
      flowerytts: false
      youtube: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
    applemusic:
      mediaAPIToken: "${APPLE_MUSIC_API_TOKEN:}"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
    deezer:
      masterDecryptionKey: "${DEEZER_MASTER_DECRYPTION_KEY:}"
      arl: "${DEEZER_ARL:}"
      formats:
        - "MP3_128"

metrics:
  prometheus:
    enabled: ${LAVALINK_PROMETHEUS_ENABLED:false}
    endpoint: ${LAVALINK_PROMETHEUS_ENDPOINT:/metrics}

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  request:
    enabled: false
    includeClientInfo: false
    includeHeaders: false
    includeQueryString: false
    includePayload: false
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 3
