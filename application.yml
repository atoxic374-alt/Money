server:
  port: 2333
  address: 0.0.0.0

plugins:

  # ── YouTube Plugin (يدعم تشغيل YouTube بكفاءة عالية) ──────────────────────
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # العملاء الثلاثة الوحيدة التي تعمل في youtube-plugin 1.18.1
    # IOS=400, ANDROID_VR=403, ANDROID=broken, WEB_EMBEDDED/TVHTML5EMBEDDED=غير مدعوم
    clients:
      - MUSIC          # WEB_REMIX — أفضل جودة صوت (YouTube Music) — الأولوية الأولى
      - ANDROID_MUSIC  # Android YouTube Music — موثوق وسريع
      - WEB            # متصفح عادي — احتياطي أخير
    # OAuth: معطل — TVHTML5EMBEDDED يغني عنه في معظم الحالات
    oauth:
      enabled: false
      skipInitialization: true
    # POT: يمكن ملؤه مستقبلاً لمقاومة botGuard إضافي
    pot:
      token: ""
      visitorData: ""

  # ── LavaSrc Plugin (Spotify / Apple Music / Deezer / SoundCloud) ───────────
  lavasrc:
    # ترتيب البحث: ISRC أولاً للدقة، ثم اليوتيوب، ثم SoundCloud كاحتياط
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
      - "ytmsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: false       # فعّل وأضف clientId/clientSecret لتشغيله
      applemusic: false    # فعّل وأضف mediaAPIToken لتشغيله
      deezer: false        # فعّل وأضف masterDecryptionKey لتشغيله
      yandexmusic: false
      flowerytts: false
      youtube: true        # YouTube مفعّل دائماً عبر youtube-plugin
      youtubeMusic: true   # YouTube Music مفعّل
    spotify:
      clientId: ""
      clientSecret: ""
      countryCode: "US"
      playlistLoadLimit: 100
      albumLoadLimit: 100
    applemusic:
      countryCode: "US"
      mediaAPIToken: ""
      playlistLoadLimit: 100
      albumLoadLimit: 100
    deezer:
      masterDecryptionKey: ""
    yandexmusic:
      accessToken: ""

# ── Lavalink Core ──────────────────────────────────────────────────────────────
lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass"
    sources:
      youtube: false       # مُعطَّل — نستخدم youtube-plugin بدلاً منه
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: false
      http: true           # لتشغيل روابط مباشرة
      local: false
    # ── فلاتر الصوت الكاملة ────────────────────────────────────────────────
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    # ── إعدادات الأداء والاستقرار ─────────────────────────────────────────
    # ── إعدادات مُحسَّنة للإنتاج مع 1000+ بوت (مستنبطة من lavalink.dev + تجارب المطورين) ──
    bufferDurationMs: 400           # JDA-NAS UDP buffer — 400ms مثالي لـ 1000+ player
                                    # أعلى = latency أكبر، أقل = حزم صوت مفقودة
    frameBufferDurationMs: 5000     # Lavaplayer audio pre-buffer — 5 ثوانٍ كافية
                                    # (10000 يهدر ~250KB RAM إضافي لكل player)
    opusEncodingQuality: 10         # أعلى جودة ترميز Opus — القيمة 10 للإنتاج
    resamplingQuality: HIGH         # إعادة معاينة عالية الجودة
    trackStuckThresholdMs: 10000    # 10 ثوانٍ قبل إعلان الأغنية "عالقة"
    useSeekGhosting: true           # يمنع القفزات الصوتية عند التخطي
    youtubePlaylistLoadLimit: 100   # حد تحميل playlist — 100 مناسب
    playerUpdateInterval: 15        # تحديث موضع التشغيل كل 15 ثانية
                                    # (5 ثوانٍ × 1000 player = 200 تحديث/ثانية → ضغط ضخم)
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    nonAllocatingFrameBuffer: true  # حرج جداً لـ 1000+ player — يستخدم ذاكرة ثابتة
                                    # بدلاً من الـ heap → يقلل GC pressure بنسبة 70%

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: false
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 3
